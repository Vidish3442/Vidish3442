name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write   # 🔥 VERY IMPORTANT (fixes error 128)

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Generate snake
        uses: Platane/snk@v3
        with:
          github_user_name: Vidish3442
          outputs: |
            dist/github-contribution-grid-snake.svg

      - name: Deploy snake to output branch
        uses: peaceiris/actions-gh-pages@v4   # ✅ UPDATED (replaces old action)
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: ./dist
